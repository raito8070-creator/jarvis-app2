<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S. Core</title>
  <style>
    :root {
      --jarvis-cyan: #00f3ff;
      --jarvis-bg: #030509;
    }
    body {
      background-color: var(--jarvis-bg);
      color: var(--jarvis-cyan);
      font-family: 'Helvetica Neue', sans-serif;
      text-align: center;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h1 {
      font-size: 28px;
      font-weight: 200;
      letter-spacing: 4px;
      margin-bottom: 50px;
      text-shadow: 0 0 15px var(--jarvis-cyan);
    }
    .core-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 60px;
    }
    .arc-reactor {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 2px solid var(--jarvis-cyan);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.3);
      animation: pulse 4s infinite ease-in-out;
    }
    .arc-reactor::before {
      content: '';
      position: absolute;
      top: 10%; left: 10%;
      width: 80%; height: 80%;
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 50%;
      animation: spin 10s linear infinite;
    }
    .status-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.7;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
      50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px rgba(0, 243, 255, 0.8); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    button {
      background: transparent;
      color: var(--jarvis-cyan);
      border: 1px solid var(--jarvis-cyan);
      padding: 15px 40px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    button.listening {
      background: rgba(255, 0, 0, 0.1);
      border-color: #ff3333;
      color: #ff3333;
      box-shadow: 0 0 20px rgba(255, 51, 51, 0.5);
    }
  </style>
</head>
<body>
  <h1>J.A.R.V.I.S.</h1>
  <div class="core-container">
    <div class="arc-reactor"></div>
    <div class="status-text" id="status">Standby</div>
  </div>
  <button id="talkBtn" onclick="startVoice()">INITIALIZE VOCAL INPUT</button>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    
    const talkBtn = document.getElementById('talkBtn');
    const statusText = document.getElementById('status');

    function startVoice() {
      recognition.start();
    }

    recognition.onstart = () => {
      talkBtn.classList.add('listening');
      talkBtn.innerText = "LISTENING...";
      statusText.innerText = "Listening";
    };

    recognition.onend = () => {
      talkBtn.classList.remove('listening');
      talkBtn.innerText = "INITIALIZE VOCAL INPUT";
      statusText.innerText = "Processing";
    };

    recognition.onresult = async (e) => {
      const text = e.results[0][0].transcript;
      const res = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text})
      });
      const data = await res.json();
      statusText.innerText = "Speaking";

      const uttr = new SpeechSynthesisUtterance(data.reply);
      uttr.lang = 'ja-JP';
      uttr.rate = 0.9;
      uttr.onend = () => { statusText.innerText = "Standby"; };
      speechSynthesis.speak(uttr);
    };

    recognition.onerror = () => {
      statusText.innerText = "Error";
      talkBtn.classList.remove('listening');
      talkBtn.innerText = "INITIALIZE VOCAL INPUT";
    };
  </script>
</body>
</html>
