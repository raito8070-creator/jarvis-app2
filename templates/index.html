<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>J.A.R.V.I.S.</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background:
        radial-gradient(
            circle at 50% 0%,
            #00282c 0%,
            #001517 25%,
            #000b0d 60%,
            #000608 100%
        );

    color: #d9ffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================
   ヘッダー
========================= */

.header {
    text-align: center;

    padding-top:
        calc(env(safe-area-inset-top) + 18px);

    padding-bottom: 15px;
}

.logo {
    color: #5d9295;

    font-size: 18px;

    letter-spacing: 9px;

    opacity: 0.65;
}

/* =========================
   チャットエリア
========================= */

.chat {
    width: 100%;

    padding:
        10px 32px 180px;

    display: flex;

    flex-direction: column;

    gap: 28px;
}

.message {
    position: relative;

    padding: 28px 38px;

    max-width: 90%;

    border-radius: 0;

    animation: appear 0.35s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* JARVIS */

.jarvis {
    align-self: flex-start;

    background:
        linear-gradient(
            135deg,
            rgba(0, 45, 49, 0.65),
            rgba(0, 22, 25, 0.75)
        );

    border-left:
        9px solid #18e5e9;

    box-shadow:
        0 0 20px rgba(0, 230, 240, 0.05);
}

/* YOU */

.you {
    align-self: flex-end;

    background:
        linear-gradient(
            135deg,
            #080909,
            #101010
        );

    border-right:
        8px solid #ff8634;

    color: #ffffff;
}

.label {

    font-size: 18px;

    letter-spacing: 8px;

    color: #6da8aa;

    margin-bottom: 24px;
}

.you .label {
    color: #72aeb0;
}

.text {

    font-size: 25px;

    line-height: 1.9;

    word-break: break-word;
}

/* =========================
   入力エリア
========================= */

.controls {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        15px 32px
        calc(env(safe-area-inset-bottom) + 20px);

    background:
        linear-gradient(
            to top,
            #00090b 65%,
            transparent
        );

    z-index: 50;
}

.controls-row {

    display: flex;

    align-items: center;

    gap: 18px;
}

.input {

    flex: 1;

    height: 72px;

    padding:
        0 28px;

    border:
        2px solid #009da3;

    border-radius: 24px;

    outline: none;

    background:
        rgba(0, 22, 24, 0.75);

    color: #ffffff;

    font-size: 19px;

    font-weight: 400;
}

.input::placeholder {
    color: #9d9d9d;
}

.input:focus {
    border-color: #25f3f5;

    box-shadow:
        0 0 20px
        rgba(0, 240, 245, 0.15);
}

/* ボタン */

.button {

    width: 80px;
    height: 72px;

    border:
        2px solid #19e8ed;

    border-radius: 24px;

    background:
        rgba(0, 25, 27, 0.8);

    color: #20eff3;

    font-size: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    transition: 0.2s;
}

.button:active {

    transform: scale(0.93);

    background:
        rgba(0, 255, 255, 0.15);
}

.button.listening {

    border-color: #ff8634;

    color: #ff8634;

    box-shadow:
        0 0 20px
        rgba(255, 134, 52, 0.4);
}

/* =========================
   ステータス
========================= */

.status {

    text-align: center;

    margin-top: 25px;

    color: #35777a;

    font-size: 14px;

    letter-spacing: 5px;
}

.status.online {
    color: #22cfd2;
}

.status.error {
    color: #ff6c6c;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    .chat {
        padding:
            10px 32px 190px;
    }

    .message {
        max-width: 94%;

        padding:
            25px 30px;
    }

    .text {
        font-size: 23px;

        line-height: 1.85;
    }

    .controls {
        padding-left: 32px;
        padding-right: 32px;
    }

    .button {
        width: 74px;
    }

}

</style>
</head>

<body>

<div class="header">
    <div class="logo">
        J · A · R · V · I · S ·
    </div>
</div>


<div id="chat" class="chat">

    <div class="message jarvis">

        <div class="label">
            J · A · R · V · I · S ·
        </div>

        <div class="text">
            こんにちは、サー。<br>
            システムは正常に稼働しております。<br><br>
            本日はどのようなご用件でしょうか？
        </div>

    </div>

</div>


<div class="controls">

    <div class="controls-row">

        <input
            id="messageInput"
            class="input"
            type="text"
            autocomplete="off"
            placeholder="J.A.R.V.I.S.に指示してください"
        >

        <button
            id="micButton"
            class="button"
            type="button"
            aria-label="音声入力"
        >
            🎙️
        </button>

        <button
            id="sendButton"
            class="button"
            type="button"
            aria-label="送信"
        >
            ➤
        </button>

    </div>

    <div id="status" class="status online">
        SECURE CHANNEL　//　VOICE + TEXT INTERFACE
    </div>

</div>


<script>

/* =========================
   要素
========================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const statusText =
    document.getElementById("status");


/* =========================
   メッセージ表示
========================= */

function addMessage(type, text) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const label =
        document.createElement("div");

    label.className =
        "label";

    label.textContent =
        type === "you"
        ? "Y O U"
        : "J · A · R · V · I · S ·";

    const content =
        document.createElement("div");

    content.className =
        "text";

    content.textContent =
        text;

    message.appendChild(label);
    message.appendChild(content);

    chat.appendChild(message);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    return message;
}


/* =========================
   読み上げ
========================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "ja-JP";

    utterance.rate = 0.95;

    utterance.pitch = 0.9;

    utterance.volume = 1.0;

    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================
   Geminiへ送信
========================= */

async function sendMessage() {

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    addMessage(
        "you",
        message
    );

    input.value = "";

    statusText.textContent =
        "J.A.R.V.I.S. IS THINKING...";

    statusText.className =
        "status";

    sendButton.disabled = true;

    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "通信エラー"
            );
        }

        addMessage(
            "jarvis",
            data.response
        );

        statusText.textContent =
            "SECURE CHANNEL　//　VOICE + TEXT INTERFACE";

        statusText.className =
            "status online";

        // 回答を読み上げ
        speak(data.response);

    } catch (error) {

        console.error(error);

        addMessage(
            "jarvis",
            "申し訳ありません、サー。現在AIとの通信に問題が発生しております。少し時間を置いて再度お試しください。"
        );

        statusText.textContent =
            "COMMUNICATION ERROR";

        statusText.className =
            "status error";

    } finally {

        sendButton.disabled = false;

        input.focus();
    }
}


/* =========================
   送信ボタン
========================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================
   Enter送信
========================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================
   音声入力
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let listening = false;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "ja-JP";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            listening = true;

            micButton.classList.add(
                "listening"
            );

            statusText.textContent =
                "LISTENING...";
        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0].transcript;

            input.value = text;

            // 音声入力後、自動送信
            sendMessage();
        };


    recognition.onerror =
        function(event) {

            console.error(
                "Speech recognition error:",
                event.error
            );

            statusText.textContent =
                "VOICE INPUT ERROR";

            statusText.className =
                "status error";
        };


    recognition.onend =
        function() {

            listening = false;

            micButton.classList.remove(
                "listening"
            );

            if (
                statusText.textContent ===
                "LISTENING..."
            ) {

                statusText.textContent =
                    "SECURE CHANNEL　//　VOICE + TEXT INTERFACE";

                statusText.className =
                    "status online";
            }

        };


    micButton.addEventListener(
        "click",
        function() {

            if (listening) {

                recognition.stop();

                return;
            }

            try {

                recognition.start();

            } catch (error) {

                console.error(error);

            }

        }
    );

} else {

    micButton.addEventListener(
        "click",
        function() {

            alert(
                "このブラウザでは音声入力に対応していません。"
            );

        }
    );

}


/* =========================
   初期状態
========================= */

window.addEventListener(
    "load",
    function() {

        input.focus();

    }
);

</script>

</body>
</html>
