<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>J.A.R.V.I.S.</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #00090b;
    color: #d9ffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================
   ヘッダー
========================= */

.header {
    text-align: center;
    padding: 38px 20px 20px;
}

.logo {
    color: #62bfc2;
    font-size: 21px;
    letter-spacing: 11px;
    margin-left: 10px;
}

/* =========================
   チャット
========================= */

.chat {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 10px 32px 230px;
}

.message {
    margin: 24px 0;
    padding: 25px 38px;
    font-size: 22px;
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
}

.jarvis {
    margin-right: 10%;
    background: #001416;
    border-left: 8px solid #16e9ee;
}

.user {
    margin-left: 10%;
    background: #0b0c0c;
    border-right: 8px solid #ff8b32;
}

.label {
    font-size: 15px;
    letter-spacing: 7px;
    color: #6db8bb;
    margin-bottom: 14px;
}

.user .label {
    text-align: left;
}

/* =========================
   入力エリア
========================= */

.controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    padding:
        18px
        28px
        calc(18px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            #00090b 80%,
            transparent
        );

    z-index: 10;
}

.input-row {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 18px;
}

.input-box {
    flex: 1;
    min-width: 0;
    height: 72px;

    border: 2px solid #008f96;
    border-radius: 28px;

    background: #001114;
    color: #e8ffff;

    padding: 0 25px;
    font-size: 19px;
    outline: none;
}

.input-box::placeholder {
    color: #8a9092;
}

.input-box:focus {
    border-color: #21f5fa;
    box-shadow: 0 0 18px rgba(20,230,240,.15);
}

.button {
    width: 90px;
    height: 72px;

    border: 2px solid #20e9ef;
    border-radius: 28px;

    background: #001114;
    color: #20e9ef;

    font-size: 31px;
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.button:active {
    transform: scale(.95);
}

.send {
    font-size: 35px;
}

.mic {
    font-size: 29px;
}

/* =========================
   下部表示
========================= */

.status {
    text-align: center;
    margin-top: 20px;

    color: #26767a;
    font-size: 14px;
    letter-spacing: 6px;
    line-height: 1.8;
}

.online {
    color: #35cfd3;
}

.typing {
    color: #5db9bc;
    font-size: 14px;
    margin: 12px 5px;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    .header {
        padding-top: 25px;
    }

    .logo {
        font-size: 17px;
        letter-spacing: 7px;
    }

    .chat {
        padding-left: 32px;
        padding-right: 32px;
        padding-bottom: 220px;
    }

    .message {
        padding: 24px 38px;
        font-size: 21px;
        line-height: 1.8;
    }

    .jarvis {
        margin-right: 7%;
    }

    .user {
        margin-left: 7%;
    }

    .input-row {
        gap: 12px;
    }

    .input-box {
        height: 64px;
        border-radius: 23px;
        font-size: 17px;
        padding: 0 18px;
    }

    .button {
        width: 67px;
        height: 64px;
        border-radius: 23px;
    }

    .status {
        font-size: 11px;
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">J . A . R . V . I . S .</div>
</header>

<main id="chat" class="chat"></main>

<div class="controls">

    <div class="input-row">

        <input
            id="messageInput"
            class="input-box"
            type="text"
            autocomplete="off"
            placeholder="J.A.R.V.I.S.に指示してください"
        >

        <button
            id="micButton"
            class="button mic"
            type="button"
            aria-label="音声入力">
            🎙️
        </button>

        <button
            id="sendButton"
            class="button send"
            type="button"
            aria-label="送信">
            ➤
        </button>

    </div>

    <div class="status">
        <span class="online">SECURE CHANNEL</span>
        &nbsp; // &nbsp;
        VOICE + TEXT INTERFACE
    </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");

let history = JSON.parse(
    localStorage.getItem("jarvis_history") || "[]"
);


/* =================================
   メッセージ表示
================================= */

function addMessage(type, text, save = true) {

    const message = document.createElement("div");

    message.className =
        "message " +
        (type === "user" ? "user" : "jarvis");

    const label = document.createElement("div");

    label.className = "label";

    label.textContent =
        type === "user"
        ? "Y O U"
        : "J . A . R . V . I . S .";

    const content = document.createElement("div");

    content.textContent = text;

    message.appendChild(label);
    message.appendChild(content);

    chat.appendChild(message);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    if (save) {

        history.push({
            role:
                type === "user"
                ? "user"
                : "assistant",

            text: text
        });

        history = history.slice(-40);

        localStorage.setItem(
            "jarvis_history",
            JSON.stringify(history)
        );
    }
}


/* =================================
   初期画面
================================= */

function startJarvis() {

    if (history.length > 0) {

        history.forEach(item => {

            addMessage(
                item.role === "user"
                    ? "user"
                    : "assistant",
                item.text,
                false
            );

        });

    } else {

        addMessage(
            "assistant",
            "かしこまりました、サー。\n\nシステムは正常に起動しております。\n\n何をお手伝いしましょうか？",
            false
        );
    }
}


/* =================================
   AI通信
================================= */

async function sendMessage() {

    const message = input.value.trim();

    if (!message) {
        return;
    }

    input.value = "";

    addMessage("user", message);

    const typing = document.createElement("div");

    typing.className = "typing";

    typing.textContent =
        "J.A.R.V.I.S. が処理しています…";

    chat.appendChild(typing);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    try {

        const response = await fetch(
            "/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    message: message,

                    history:
                        history.slice(-20)

                })
            }
        );

        const data = await response.json();

        typing.remove();

        const reply =
            data.reply ||
            "申し訳ありません、サー。回答を取得できませんでした。";

        addMessage(
            "assistant",
            reply
        );

        // 音声読み上げ
        speak(reply);

    }

    catch (error) {

        console.error(error);

        typing.remove();

        const reply =
            "申し訳ありません、サー。通信エラーが発生しました。";

        addMessage(
            "assistant",
            reply
        );

        speak(reply);
    }
}


/* =================================
   音声読み上げ
================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "ja-JP";

    utterance.rate = 0.95;
    utterance.pitch = 0.9;
    utterance.volume = 1.0;

    speechSynthesis.speak(utterance);
}


/* =================================
   音声入力
================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang = "ja-JP";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.onstart = () => {

        micButton.textContent = "🔴";

    };

    recognition.onend = () => {

        micButton.textContent = "🎙️";

    };

    recognition.onresult = event => {

        const result =
            event.results[0][0].transcript;

        input.value = result;

        sendMessage();
    };

    recognition.onerror = error => {

        console.log(
            "Speech recognition:",
            error
        );

        micButton.textContent = "🎙️";
    };

}


/* =================================
   ボタン
================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);

micButton.addEventListener(
    "click",
    () => {

        if (!recognition) {

            alert(
                "このブラウザでは音声入力が利用できません。"
            );

            return;
        }

        recognition.start();

    }
);


/* =================================
   Enter送信
================================= */

input.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =================================
   起動
================================= */

startJarvis();

</script>

</body>
</html>
