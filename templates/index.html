<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>J.A.R.V.I.S.</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #00090b;
    color: #dfffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
}

/* =========================
   ヘッダー
========================= */

.header {
    text-align: center;
    padding: 35px 20px 20px;
}

.logo {
    color: #5faeb1;
    font-size: 18px;
    letter-spacing: 10px;
    font-weight: 300;
}

/* =========================
   チャット
========================= */

#chat {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    padding-bottom: 210px;
}

/* AI */

.message.ai {
    margin-bottom: 30px;
    padding: 30px 28px;

    background:
        linear-gradient(
            90deg,
            rgba(0, 230, 240, 0.08),
            rgba(0, 40, 45, 0.28)
        );

    border-left: 8px solid #14e8ed;

    box-shadow:
        0 0 25px rgba(0, 230, 240, 0.04);
}

/* YOU */

.message.user {
    margin: 30px 0;
    margin-left: 12%;

    padding: 25px 28px;

    background: #0b0d0d;

    border-right: 8px solid #ff8b2c;
}

.label {
    color: #64aeb2;
    font-size: 17px;
    letter-spacing: 8px;
    margin-bottom: 25px;
}

.message.user .label {
    color: #6faeb0;
}

.text {
    font-size: 23px;
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
}

/* =========================
   入力エリア
========================= */

.controls {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;

    padding: 18px 18px 28px;

    background:
        linear-gradient(
            to top,
            #00090b 75%,
            transparent
        );

    z-index: 100;
}

.controls-inner {
    max-width: 900px;
    margin: auto;

    display: grid;

    grid-template-columns:
        1fr
        82px
        82px;

    gap: 12px;
}

/* 入力 */

#input {
    width: 100%;
    height: 82px;

    border-radius: 25px;

    border: 2px solid #008e95;

    background: #001519;

    color: #dfffff;

    padding: 0 22px;

    font-size: 19px;

    outline: none;
}

#input:focus {
    border-color: #17edf2;

    box-shadow:
        0 0 18px rgba(0, 240, 255, 0.18);
}

#input::placeholder {
    color: #858f90;
}

/* ボタン */

button {
    height: 82px;

    border-radius: 25px;

    border: 2px solid #18edf2;

    background: #001519;

    color: #dfffff;

    font-size: 30px;

    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

#micBtn.listening {
    background: #083c40;

    box-shadow:
        0 0 25px rgba(0, 240, 255, 0.5);

    animation: pulse 1s infinite;
}

@keyframes pulse {

    0% {
        box-shadow:
            0 0 5px rgba(0,240,255,.2);
    }

    50% {
        box-shadow:
            0 0 30px rgba(0,240,255,.8);
    }

    100% {
        box-shadow:
            0 0 5px rgba(0,240,255,.2);
    }

}

/* =========================
   下部表示
========================= */

.status {
    text-align: center;

    margin-top: 25px;

    color: #29777b;

    letter-spacing: 7px;

    font-size: 12px;
}

/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

    #chat {
        padding: 10px 12px 190px;
    }

    .message.ai {
        padding: 25px 20px;
        border-left-width: 7px;
    }

    .message.user {
        margin-left: 8%;
        padding: 22px 20px;
        border-right-width: 7px;
    }

    .text {
        font-size: 20px;
        line-height: 1.85;
    }

    .label {
        font-size: 14px;
        letter-spacing: 6px;
    }

    .controls {
        padding: 12px 12px 24px;
    }

    .controls-inner {
        grid-template-columns:
            1fr
            75px
            75px;

        gap: 8px;
    }

    #input,
    button {
        height: 72px;
    }

    #input {
        font-size: 17px;
    }

}

</style>
</head>


<body>


<!-- =========================
     ヘッダー
========================= -->

<header class="header">

    <div class="logo">
        J . A . R . V . I . S .
    </div>

</header>


<!-- =========================
     チャット
========================= -->

<main id="chat">

    <div class="message ai">

        <div class="label">
            J . A . R . V . I . S .
        </div>

        <div class="text">
かしこまりました、サー。

システムは正常に起動しております。

本日はどのようなご用件でしょうか？
        </div>

    </div>

</main>


<!-- =========================
     操作
========================= -->

<div class="controls">

    <div class="controls-inner">

        <input
            id="input"
            type="text"
            placeholder="J.A.R.V.I.S.に指示してください"
            autocomplete="off"
        >

        <button
            id="micBtn"
            type="button"
            title="音声入力"
        >
            🎙️
        </button>

        <button
            id="sendBtn"
            type="button"
            title="送信"
        >
            ➤
        </button>

    </div>

    <div
        id="status"
        class="status"
    >
        SECURE CHANNEL　//　VOICE + TEXT INTERFACE
    </div>

</div>


<script>

/* ========================================
   要素
======================================== */

const input =
    document.getElementById("input");

const sendBtn =
    document.getElementById("sendBtn");

const micBtn =
    document.getElementById("micBtn");

const chat =
    document.getElementById("chat");

const status =
    document.getElementById("status");


/* ========================================
   会話履歴
======================================== */

let history = [];


/* ========================================
   音声認識
======================================== */

let recognition = null;

let listening = false;


/*
   Safari / Chrome 対応
*/

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.lang = "ja-JP";

    recognition.continuous = false;

    recognition.interimResults = false;


    recognition.onstart = function() {

        listening = true;

        micBtn.classList.add("listening");

        status.textContent =
            "LISTENING // 音声を認識しています";

    };


    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        input.value = text;

        status.textContent =
            "VOICE RECEIVED // 音声を受信しました";

        /*
           音声認識したら自動送信
        */

        setTimeout(() => {

            sendMessage();

        }, 300);

    };


    recognition.onerror = function(event) {

        console.log(
            "Speech recognition error:",
            event.error
        );

        status.textContent =
            "VOICE ERROR // 音声認識エラー";

    };


    recognition.onend = function() {

        listening = false;

        micBtn.classList.remove("listening");

        setTimeout(() => {

            status.textContent =
                "SECURE CHANNEL // VOICE + TEXT INTERFACE";

        }, 1500);

    };

} else {

    micBtn.disabled = true;

    status.textContent =
        "VOICE INPUT NOT SUPPORTED";

}


/* ========================================
   マイク
======================================== */

micBtn.addEventListener(
    "click",
    function() {

        if (!recognition) {

            alert(
                "このブラウザでは音声入力を利用できません。"
            );

            return;

        }


        if (listening) {

            recognition.stop();

            return;

        }


        try {

            recognition.start();

        } catch (error) {

            console.log(error);

        }

    }
);


/* ========================================
   AIメッセージ追加
======================================== */

function addMessage(
    type,
    text
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const label =
        document.createElement("div");

    label.className =
        "label";


    label.textContent =
        type === "user"
            ? "Y O U"
            : "J . A . R . V . I . S .";


    const textElement =
        document.createElement("div");

    textElement.className =
        "text";

    textElement.textContent =
        text;


    message.appendChild(label);

    message.appendChild(textElement);

    chat.appendChild(message);


    window.scrollTo({

        top: document.body.scrollHeight,

        behavior: "smooth"

    });

}


/* ========================================
   音声読み上げ
======================================== */

function speak(text) {

    if (!("speechSynthesis" in window)) {

        return;

    }


    /*
       前の音声を停止
    */

    speechSynthesis.cancel();


    /*
       読み上げ用テキスト
    */

    const cleanText =
        text
        .replace(
            /[*_#`]/g,
            ""
        );


    const utterance =
        new SpeechSynthesisUtterance(
            cleanText
        );


    utterance.lang =
        "ja-JP";

    utterance.rate =
        0.95;

    utterance.pitch =
        0.85;

    utterance.volume =
        1.0;


    utterance.onstart =
        function() {

            status.textContent =
                "J.A.R.V.I.S. // SPEAKING";

        };


    utterance.onend =
        function() {

            status.textContent =
                "SECURE CHANNEL // READY";

        };


    speechSynthesis.speak(
        utterance
    );

}


/* ========================================
   AIへ送信
======================================== */

async function sendMessage() {

    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    /*
       ユーザー表示
    */

    addMessage(
        "user",
        message
    );


    /*
       入力欄をクリア
    */

    input.value = "";


    /*
       通信中
    */

    status.textContent =
        "J.A.R.V.I.S. // PROCESSING";


    /*
       AIへ送信
    */

    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        message:
                            message,

                        history:
                            history

                    })

                }
            );


        const data =
            await response.json();


        const reply =
            data.reply ||
            "申し訳ありません、サー。回答を取得できませんでした。";


        /*
           AI表示
        */

        addMessage(
            "ai",
            reply
        );


        /*
           履歴保存
        */

        history.push({

            role: "user",

            text: message

        });


        history.push({

            role: "assistant",

            text: reply

        });


        /*
           最大40件
        */

        if (history.length > 40) {

            history =
                history.slice(-40);

        }


        /*
           音声で回答
        */

        speak(reply);


    } catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );


        const errorMessage =
            "申し訳ありません、サー。通信中にエラーが発生しました。";


        addMessage(
            "ai",
            errorMessage
        );


        speak(
            errorMessage
        );

    }

}


/* ========================================
   送信ボタン
======================================== */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* ========================================
   Enterキー
======================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>
</html>
