<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
:root{--bg:#03070d;--panel:rgba(7,18,30,.82);--line:#1b86a8;--cyan:#62eaff;--text:#eafcff;--muted:#79a9b8}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 0,#0b2638 0,#03070d 48%,#010308 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
header{padding:18px 18px 8px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:3px}.status{font-size:12px;color:var(--cyan)} 
main{max-width:900px;margin:auto;padding:8px 14px 150px}.orb{width:110px;height:110px;border:1px solid #2ac9ee;border-radius:50%;margin:14px auto 22px;box-shadow:0 0 25px #0b9cc7, inset 0 0 25px #0b9cc7;display:grid;place-items:center;position:relative}.orb:before,.orb:after{content:"";position:absolute;border:1px solid #1e6681;border-radius:50%}.orb:before{inset:13px}.orb:after{inset:27px}.core{width:15px;height:15px;background:var(--cyan);border-radius:50%;box-shadow:0 0 25px 8px #1bbfe8}
#chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 14px;border:1px solid #174e62;border-radius:15px;background:var(--panel);white-space:pre-wrap;line-height:1.55}.user{align-self:flex-end;border-color:#286f86}.ai{align-self:flex-start}
.toolbar{position:fixed;bottom:76px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:4}.tool{background:#081521;border:1px solid #23677e;color:#bceffc;border-radius:12px;padding:9px 11px}.tool.active{border-color:var(--cyan);box-shadow:0 0 12px #0b7995}
.composer{position:fixed;bottom:0;left:0;right:0;background:rgba(2,8,14,.96);border-top:1px solid #123e4d;padding:10px;display:flex;gap:8px;z-index:5;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
textarea{flex:1;min-height:45px;max-height:120px;resize:none;background:#07131d;color:white;border:1px solid #22546a;border-radius:13px;padding:12px;font-size:16px}.btn{border:1px solid #267a94;background:#09202b;color:#c8f7ff;border-radius:13px;padding:0 14px;font-size:20px}.btn:active{transform:scale(.96)}
input[type=file]{display:none}.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:15px}
#drop{display:none;position:fixed;inset:10%;background:#071522ee;border:1px dashed var(--cyan);border-radius:20px;z-index:20;place-items:center;text-align:center;padding:20px}
</style>
</head>
<body>
<header><div class="brand">J.A.R.V.I.S.</div><div class="status" id="status">● ONLINE</div></header>
<main>
<div class="orb"><div class="core"></div></div>
<div id="chat"></div>
<div class="hint">音声・検索・画像・PDF・履歴・コマンド対応</div>
</main>
<div class="toolbar">
<button class="tool active" id="searchBtn">🌐検索</button>
<label class="tool">📷画像<input id="imageInput" type="file" accept="image/*"></label>
<label class="tool">📄PDF<input id="fileInput" type="file" accept=".pdf,.txt,.md,.csv"></label>
<button class="tool" id="clearBtn">🧹履歴</button>
</div>
<div class="composer">
<button class="btn" id="micBtn">🎙️</button>
<textarea id="input" placeholder="サー、何をご命令ですか？"></textarea>
<button class="btn" id="sendBtn">➤</button>
</div>
<div id="drop"><div>📷 画像をここで選択してください</div></div>

<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), statusEl=document.getElementById('status');
const searchBtn=document.getElementById('searchBtn'), micBtn=document.getElementById('micBtn');
let useSearch=true;
let history=JSON.parse(localStorage.getItem('jarvis_history')||'[]');

function add(role,text,save=true){
  const d=document.createElement('div'); d.className='msg '+(role==='user'?'user':'ai'); d.textContent=text; chat.appendChild(d);
  window.scrollTo(0,document.body.scrollHeight);
  if(save){history.push({role,text}); history=history.slice(-30); localStorage.setItem('jarvis_history',JSON.stringify(history));}
}
function speak(text){ if('speechSynthesis' in window){speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.95;u.pitch=.95;speechSynthesis.speak(u)}}
function setBusy(v){statusEl.textContent=v?'◌ THINKING...':'● ONLINE'}

async function send(){
  const message=input.value.trim(); if(!message)return;
  input.value=''; add('user',message); setBusy(true);
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,use_search,history:history.slice(-12,-1)})});
    const d=await r.json(); if(!d.success) throw new Error(d.error||'通信エラー');
    add('assistant',d.reply); speak(d.reply);
  }catch(e){add('assistant','申し訳ありません、サー。\n'+e.message)}
  finally{setBusy(false)}
}
document.getElementById('sendBtn').onclick=send;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

searchBtn.onclick=()=>{useSearch=!useSearch;searchBtn.classList.toggle('active',useSearch);searchBtn.textContent=useSearch?'🌐検索ON':'🌐検索OFF'};

document.getElementById('clearBtn').onclick=()=>{history=[];localStorage.removeItem('jarvis_history');chat.innerHTML='';add('assistant','履歴を消去しました、サー。');};

async function analyzeImage(file){
  if(!file)return; setBusy(true); add('user','📷 画像を解析してください');
  const fd=new FormData();fd.append('image',file);fd.append('prompt',input.value.trim()||'この画像を詳しく説明してください。');input.value='';
  try{const r=await fetch('/analyze',{method:'POST',body:fd});const d=await r.json();if(!d.success)throw Error(d.error||'画像解析エラー');add('assistant',d.reply);speak(d.reply)}catch(e){add('assistant','画像解析に失敗しました。\n'+e.message)}finally{setBusy(false)}
}
document.getElementById('imageInput').onchange=e=>analyzeImage(e.target.files[0]);

document.getElementById('fileInput').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;setBusy(true);add('user','📄 '+file.name+' を解析してください');
 const fd=new FormData();fd.append('file',file);fd.append('prompt',input.value.trim()||'このファイルの重要点を日本語で要約してください。');input.value='';
 try{const r=await fetch('/document',{method:'POST',body:fd});const d=await r.json();if(!d.success)throw Error(d.error||'ファイル解析エラー');add('assistant',d.reply);speak(d.reply)}catch(e){add('assistant','ファイル解析に失敗しました。\n'+e.message)}finally{setBusy(false)}
};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
 const rec=new SR();rec.lang='ja-JP';rec.interimResults=true;
 rec.onstart=()=>{micBtn.textContent='⏺️';statusEl.textContent='● LISTENING...'};
 rec.onend=()=>{micBtn.textContent='🎙️';setBusy(false)};
 rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript;input.value=s};
 micBtn.onclick=()=>{try{rec.start()}catch{}};
}else{
 micBtn.onclick=()=>{input.focus();input.placeholder='iPhoneのキーボードの🎤で話してください';};
}

history.forEach(x=>add(x.role,x.text,false));
if(!history.length)add('assistant','システムオンライン。サー、ご命令をどうぞ。');
</script>
</body>
</html>
